apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: waylonwalker-com-prod-nvme-ab-a
  namespace: argocd
  labels:
    environment: issue-143-canary
    app.kubernetes.io/environment: issue-143-canary
spec:
  project: default
  sources:
    - repoURL: https://github.com/WaylonWalker/markata.git
      targetRevision: aac5b49752518ab84b7541385d0d42706e79a41d
      path: helm-chart
      helm:
        valueFiles:
          - $values/values/issue-143/common.yaml
          - $values/values/issue-143/a.yaml
    - repoURL: https://github.com/waylonwalker/homelab-argo.git
      targetRevision: codex/issue-143-blocked-report
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: waylonwalker-com-prod-nvme-ab-a-notes
  ignoreDifferences:
    - group: ""
      kind: PersistentVolumeClaim
      name: waylonwalker-com-prod-nvme-ab-a-notes-source-pvc
      namespace: waylonwalker-com-prod-nvme-ab-a-notes
      jsonPointers:
        - /spec/volumeName
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
