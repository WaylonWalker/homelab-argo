apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: notify-bridge-cleanup
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/waylonwalker/homelab-argo.git
    targetRevision: HEAD
    path: k8s/notify-bridge-cleanup
  destination:
    server: https://kubernetes.default.svc
    namespace: notify-bridge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - FailOnSharedResource=true
