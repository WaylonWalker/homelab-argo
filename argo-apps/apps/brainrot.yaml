apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: brainrot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/waylonwalker/homelab-argo.git
    targetRevision: HEAD
    path: k8s/brainrot/helm-chart
  destination:
    server: https://kubernetes.default.svc
    namespace: brainrot
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
