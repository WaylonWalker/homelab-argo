apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hlab-auth-oidc-stage
  namespace: argocd
spec:
  project: forgejo-mcp-oidc-stage
  source:
    repoURL: https://github.com/WaylonWalker/homelab-argo.git
    targetRevision: HEAD
    path: k8s/homelab-auth-oidc-stage
  destination:
    server: https://kubernetes.default.svc
    namespace: hlab-auth-oidc-stage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
