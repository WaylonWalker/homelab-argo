apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: status
  namespace: argocd
spec:
  project: default
  destination:
    namespace: status
    server: 'https://kubernetes.default.svc'
  source:
    path: k8s/status
    repoURL: 'https://github.com/waylonwalker/homelab-argo'
    targetRevision: HEAD
  syncPolicy:
    automated:
      prune: true
