apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: markata-docs
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: markata
    app.kubernetes.io/environment: production
spec:
  project: default
  sources:
    - repoURL: https://github.com/WaylonWalker/homelab-argo.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/WaylonWalker/homelab-argo.git
      targetRevision: main
      path: k8s/markata-docs
    - repoURL: https://github.com/WaylonWalker/markata.git
      targetRevision: main
      path: helm-chart
      helm:
        valueFiles:
          - $values/k8s/markata-docs/helm-values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: markata-docs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    enabled: false
