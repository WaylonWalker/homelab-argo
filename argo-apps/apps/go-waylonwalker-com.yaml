apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-waylonwalker-com
  namespace: argocd
  labels:
    environment: dev
    app.kubernetes.io/environment: dev
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/waylonwalker/homelab-argo'
      targetRevision: HEAD
      path: k8s/waylonwalker-com/go-waylonwalker-com
      ref: values
    - repoURL: 'https://github.com/WaylonWalker/markata.git'
      targetRevision: main
      path: helm-chart
      helm:
        valueFiles:
          - $values/argo-apps/values/go-waylonwalker-com.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: go-waylonwalker-com-notes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
