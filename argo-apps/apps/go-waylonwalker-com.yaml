apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: go-waylonwalker-com
  namespace: argocd
  labels:
    environment: dev
    app.kubernetes.io/environment: dev
spec:
  project: default
  sources:
    - repoURL: 'https://github.com/waylonwalker/homelab-argo'
      targetRevision: HEAD
      path: waylonwalker-com/go-waylonwalker-com
    - repoURL: 'https://github.com/WaylonWalker/markata-go.git'
      targetRevision: markata/go-perf
      path: helm-chart
      helm:
        values: |
          project_identifier: go-waylonwalker-com
          project_name: waylonwalker-com
          environment: dev

          imagePullSecrets: []

          nodeSelector:
            kubernetes.io/hostname: falcon3

          offline:
            enabled: false

          ingress:
            host: go.waylonwalker.com
            ingressClassName: traefik
            tls:
              enabled: true
              secretName: go-waylonwalker-com-tls

          markataEncryption:
            secretName: markata-go-encryption

          aws:
            existingSecretName: ""

          storage:
            source:
              mode: hostPath
              hostPath:
                path: /mnt/main/walkershare/waylon/vaults/go.waylonwalker.com
                type: Directory
            site:
              mode: hostPath
              hostPath:
                path: /mnt/main/walkershare/waylon/sites/go.waylonwalker.com
                type: DirectoryOrCreate
            cache:
              enabled: true
              mode: hostPath
              hostPath:
                path: /mnt/main/walkershare/waylon/cache/go.waylonwalker.com
                type: DirectoryOrCreate
            search:
              storageClassName: local-path
              pvcNameSuffix: "-local"
              size: 5Gi

          build:
            fetchImage:
              tag: sha-a3d18a8
            builderImage:
              tag: sha-a3d18a8
            fast: false
            successfulJobsHistoryLimit: 20
            failedJobsHistoryLimit: 10
            ttlSecondsAfterFinished: 2592000
            activeDeadlineSeconds: 7200
            cacheDir: /data/cache/xdg
            notify:
              enabled: true
              url: https://ntfy.wayl.one/opencode
            releases:
              keep: 25
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
                ephemeral-storage: 8Gi
              limits:
                memory: 16Gi
                ephemeral-storage: 20Gi
            extraEnv:
              # Keep enough parallelism for cached post restoration and asset work.
              - name: MARKATA_GO_CONCURRENCY
                value: "16"
              - name: MARKATA_GO_URL
                value: "https://go.waylonwalker.com"
              - name: MARKATA_GO_SEARCH_ENDPOINT
                value: "https://go.waylonwalker.com/api/search"
              - name: MARKATA_GO_SEARCH_BLEVE_ENDPOINT
                value: "https://go.waylonwalker.com/api/search"

          builderAdmin:
            enabled: true
            fast: false
            auth:
              # Traefik runs on falcon2's pod subnet; builder-admin peers run
              # on falcon3's pod subnet during active/standby handoff.
              trustedProxyCIDRs:
                - 10.42.0.0/24
                - 10.42.2.0/24
            ingress:
              enabled: true
              host: gobuilder.waylonwalker.com
              ingressClassName: traefik
              tls:
                enabled: true
                secretName: gobuilder-waylonwalker-com-tls
              auth:
                # ForwardAuth must call the Service directly so hlab-auth
                # receives Traefik's original protected-host headers.
                enabled: true
                internalUrl: http://hlab-auth.hlab-auth.svc.cluster.local:8000
                # Keep profile-picture requests same-site with gobuilder so
                # hlab-auth's SameSite=Lax browser session is included.
                publicAuthOrigin: https://auth.waylonwalker.com
            networkPolicy:
              enabled: true
              traefikNamespace: kube-system
              traefikNamespaceSelector:
                kubernetes.io/metadata.name: kube-system
              traefikPodSelector:
                app.kubernetes.io/name: traefik
                app.kubernetes.io/instance: traefik-kube-system
            mermaidMode: client
            watch:
              enabled: false
              debounce: 2s
            releases:
              keep: 25
            history:
              successfulBuilds: 60
              failedBuilds: 100
              refreshRuns: 100
            buildTimeoutSeconds: 7200
            historyDir: /data/site/.builder-admin
            webhook:
              enabled: true
              branch: main
              existingSecretName: builder-webhook
              existingSecretKey: MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET
            resources:
              requests:
                cpu: 100m
                memory: 4Gi
                ephemeral-storage: 8Gi
              limits:
                memory: 16Gi
                ephemeral-storage: 20Gi
            refreshTasks:
              - name: reader-update
                every: 30m
                enqueueBuildOnSuccess: true
                args:
                  - --config
                  - /data/source/markata-go.toml
                  - reader
                  - update

          search:
            enabled: true
            image:
              tag: sha-a3d18a8
            mode: watch-content

          sourceArchive:
            bucket: unused-in-hostpath-mode
            location: /unused-in-hostpath-mode
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: go-waylonwalker-com-notes
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
