apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: cutlist
  namespace: argocd
spec:
  description: Static site for cutlist.waylonwalker.com
  sourceRepos:
    - https://github.com/waylonwalker/homelab-argo.git
  destinations:
    - namespace: cutlist
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
    - group: ""
      kind: PersistentVolume
  namespaceResourceWhitelist:
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: ""
      kind: Service
    - group: apps
      kind: Deployment
    - group: networking.k8s.io
      kind: Ingress
