apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stillframe
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/waylonwalker/homelab-argo
    targetRevision: HEAD
    path: k8s/stillframe
  destination:
    server: https://kubernetes.default.svc
    namespace: stillframe
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
