apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: recipes-waylonwalker-com
  namespace: argocd
spec:
  project: default
  destination:
    namespace: recipes-waylonwalker-com
    server: https://kubernetes.default.svc
  source:
    repoURL: https://github.com/waylonwalker/homelab-argo.git
    targetRevision: HEAD
    path: k8s/recipes-waylonwalker-com
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - FailOnSharedResource=true
