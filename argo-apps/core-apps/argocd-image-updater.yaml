apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-image-updater
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://argoproj.github.io/argo-helm
    chart: argocd-image-updater
    targetRevision: 1.3.2
    helm:
      values: |
        # Argo CD Image Updater v1.x uses ImageUpdater CRs, not Application
        # annotations. Keep the controller independent of Markata Helm charts.
        crds:
          install: true
          keep: true
        config:
          git.user: argocd-image-updater
          git.email: argocd-image-updater@users.noreply.github.com
          log.level: info
        extraArgs:
          - --interval
          - 2m
        rbac:
          enabled: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
