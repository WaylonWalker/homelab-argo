apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: telemetry-bootstrap
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/waylonwalker/homelab-argo.git
    targetRevision: HEAD
    path: k8s/telemetry-bootstrap
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
