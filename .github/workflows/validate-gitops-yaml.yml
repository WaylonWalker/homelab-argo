name: Validate GitOps YAML changes
on:
  pull_request:
permissions:
  contents: read
jobs:
  parse-changed-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install YAML parser
        run: python -m pip install --quiet 'PyYAML==6.0.3'
      - name: Validate changed manifests
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import subprocess
          import sys
          import yaml

          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMRT',
               os.environ['BASE_SHA'], 'HEAD'], text=True
          ).splitlines()
          checked = []
          errors = []
          for path in changed:
              if not path.endswith(('.yaml', '.yml')):
                  continue
              if '/helm-chart/templates/' in path:
                  continue  # Helm templates must be rendered before parsing
              if not path.startswith(('k8s/', 'argo-apps/', 'argocd/', 'system-upgrade/')):
                  continue
              p = Path(path)
              if not p.is_file():
                  continue
              try:
                  docs = list(yaml.safe_load_all(p.read_text()))
                  for obj in docs:
                      if isinstance(obj, dict) and 'kind' in obj and not isinstance(obj.get('apiVersion'), str):
                          raise ValueError('resource kind has no apiVersion')
                  checked.append(path)
              except (yaml.YAMLError, ValueError) as e:
                  errors.append(f'{path}: {e}')
          print(f'Parsed {len(checked)} changed YAML files')
          if errors:
              print('\n'.join(errors), file=sys.stderr)
              sys.exit(1)
          PY
      - name: Scan current source for secrets
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            detect --no-git --source /repo --config /repo/.gitleaks.toml --redact
