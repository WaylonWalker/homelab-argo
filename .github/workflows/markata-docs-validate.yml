name: Markata Docs Kubernetes

on:
  pull_request:
    paths:
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  push:
    branches: [main]
    paths:
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - name: Render Kustomize
        run: kubectl kustomize k8s/markata-docs > /tmp/markata-docs.yaml
      - name: Validate required resources and safety defaults
        run: |
          python -m pip install --quiet 'PyYAML==6.0.3'
          python - <<'PY'
          import yaml
          resources = [r for r in yaml.safe_load_all(open('/tmp/markata-docs.yaml')) if r]
          indexed = {(r['kind'], r['metadata']['name']): r for r in resources}
          required = [
              ('Deployment', 'markata-docs'),
              ('Deployment', 'markata-docs-builder'),
              ('PersistentVolumeClaim', 'markata-docs-site'),
              ('Service', 'markata-docs'),
              ('Service', 'markata-docs-builder'),
              ('Ingress', 'markata-docs'),
              ('Ingress', 'markata-docs-apex'),
              ('Ingress', 'markata-docs-builder'),
              ('Middleware', 'markata-docs-builder-auth'),
              ('Middleware', 'markata-docs-builder-strip-identity'),
              ('Middleware', 'markata-docs-builder-forward-auth'),
              ('NetworkPolicy', 'markata-docs-builder-ingress'),
              ('ConfigMap', 'markata-docs-nginx'),
          ]
          missing = [key for key in required if key not in indexed]
          assert not missing, f'Missing resources: {missing}'
          assert all(r['metadata'].get('namespace') == 'markata-docs' for r in resources), 'Wrong namespace'
          deploy = indexed[('Deployment','markata-docs')]
          builder = indexed[('Deployment','markata-docs-builder')]
          pvc = indexed[('PersistentVolumeClaim','markata-docs-site')]
          assert pvc['spec']['accessModes'] == ['ReadWriteOnce']
          for obj in (deploy, builder):
              pod = obj['spec']['template']['spec']
              assert pod['nodeSelector']['kubernetes.io/hostname'] == 'falcon3'
              assert pod['automountServiceAccountToken'] is False
          pod = builder['spec']['template']['spec']
          assert pod['containers'][0]['securityContext']['allowPrivilegeEscalation'] is False
          assert not pod['containers'][0]['securityContext'].get('runAsUser') == 0
          assert builder['spec']['replicas'] == 1
          ingress = indexed[('Ingress','markata-docs-builder')]
          assert ingress['metadata']['annotations']['traefik.ingress.kubernetes.io/router.middlewares'].endswith('-auth@kubernetescrd')
          builder_hosts = {rule['host'] for rule in ingress['spec']['rules']}
          builder_tls_hosts = set(ingress['spec']['tls'][0]['hosts'])
          assert builder_hosts == {'build.markata.waylonwalker.com', 'markata-builder.waylonwalker.com'}
          assert builder_tls_hosts == builder_hosts
          external_hosts = set(ingress['metadata']['annotations']['external-dns.alpha.kubernetes.io/hostname'].split(','))
          assert external_hosts == builder_hosts
          existing = indexed[('Ingress', 'markata-docs')]
          apex = indexed[('Ingress', 'markata-docs-apex')]
          assert existing['spec']['rules'][0]['host'] == 'markata.waylonwalker.com'
          tls_hosts = set(existing['spec']['tls'][0]['hosts'])
          rule_hosts = {rule['host'] for rule in existing['spec']['rules']}
          assert 'markata.waylonwalker.com' in tls_hosts
          assert tls_hosts == rule_hosts
          assert apex['spec']['ingressClassName'] == 'traefik'
          assert apex['spec']['rules'][0]['host'] == 'markata.dev'
          assert apex['spec']['tls'][0]['hosts'] == ['markata.dev']
          assert apex['spec']['tls'][0]['secretName'] == 'markata-dev-tls'
          assert apex['metadata']['annotations']['cert-manager.io/cluster-issuer'] == 'letsencrypt-dns'
          assert apex['metadata']['annotations']['external-dns.alpha.kubernetes.io/hostname'] == 'markata.dev'
          backend = apex['spec']['rules'][0]['http']['paths'][0]['backend']['service']
          assert backend['name'] == 'markata-docs' and backend['port']['name'] == 'http'
          policy = indexed[('NetworkPolicy','markata-docs-builder-ingress')]
          assert policy['spec']['policyTypes'] == ['Ingress']
          print(f'Validated {len(resources)} Kubernetes objects')
          PY
