name: Markata Docs Kubernetes

on:
  pull_request:
    paths:
      - 'argo-apps/apps/markata-docs.yaml'
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  push:
    branches: [main]
    paths:
      - 'argo-apps/apps/markata-docs.yaml'
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Render the homelab overlay
        run: kubectl kustomize k8s/markata-docs > /tmp/markata-docs-overlay.yaml
      - name: Render and lint the Markata Helm chart
        run: |
          git clone --depth=1 https://github.com/WaylonWalker/markata.git /tmp/markata
          helm lint /tmp/markata/helm-chart \
            --values k8s/markata-docs/helm-values.yaml
          helm template markata-docs /tmp/markata/helm-chart \
            --namespace markata-docs \
            --values k8s/markata-docs/helm-values.yaml > /tmp/markata-docs-chart.yaml
      - name: Check rendered resources and routes
        run: |
          for expected in \
            'name: markata-docs-site' \
            'markata-docs-notes-site' \
            'markata-docs-notes-builder-admin' \
            'markata-docs-builder-webhook' \
            'https://github.com/WaylonWalker/markata.git' \
            'fsGroup: 1000' \
            'MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET' \
            'markata.waylonwalker.com' \
            'markata.dev'; do
            grep -Fq "$expected" /tmp/markata-docs-overlay.yaml /tmp/markata-docs-chart.yaml || {
              echo "Expected rendered resource value missing: $expected" >&2
              exit 1
            }
          done
          if grep -Fq 'markata-go-encryption' /tmp/markata-docs-chart.yaml; then
            echo 'The docs builder must not require an encryption Secret' >&2
            exit 1
          fi
