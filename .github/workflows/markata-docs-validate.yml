name: Markata Docs Kubernetes

on:
  pull_request:
    paths:
      - 'argo-apps/apps/markata-docs.yaml'
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  push:
    branches: [main]
    paths:
      - 'argo-apps/apps/markata-docs.yaml'
      - 'k8s/markata-docs/**'
      - '.github/workflows/markata-docs-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
      - uses: azure/setup-helm@v4
      - name: Render the homelab overlay
        run: kubectl kustomize k8s/markata-docs > /tmp/markata-docs-overlay.yaml
      - name: Render and lint the Markata Helm chart
        run: |
          git clone --depth=1 https://github.com/WaylonWalker/markata.git /tmp/markata
          helm lint /tmp/markata/helm-chart \
            --values k8s/markata-docs/helm-values.yaml
          helm template markata-docs /tmp/markata/helm-chart \
            --namespace markata-docs \
            --values k8s/markata-docs/helm-values.yaml > /tmp/markata-docs-chart.yaml
      - name: Check rendered resources and routes
        run: |
          for expected in \
            'name: markata-docs-site' \
            'markata-docs-notes-site' \
            'markata-docs-notes-builder-admin' \
            'markata-docs-builder-webhook' \
            'https://github.com/WaylonWalker/markata.git' \
            'fsGroup: 1000' \
            'MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET' \
            '/webhook' \
            'markata.waylonwalker.com' \
            'markata.dev'; do
            grep -Fq "$expected" /tmp/markata-docs-overlay.yaml /tmp/markata-docs-chart.yaml || {
              echo "Expected rendered resource value missing: $expected" >&2
              exit 1
            }
          done
          if grep -Fq 'markata-go-encryption' /tmp/markata-docs-chart.yaml; then
            echo 'The docs builder must not require an encryption Secret' >&2
            exit 1
          fi

  public-installer:
    name: Verify live branded installer matches reviewed main
    # Production publication is managed by Builder Admin, not this CI.
    # Run manually *after* the Markata webhook publishes a new release.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch public and reviewed installers without executing them
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location \
            --retry 3 --max-time 30 \
            https://markata.dev/install.sh -o /tmp/markata-public-install.sh
          curl --fail --show-error --silent --location \
            --retry 3 --max-time 30 \
            https://raw.githubusercontent.com/WaylonWalker/markata/main/install.sh \
            -o /tmp/markata-reviewed-install.sh
          test -s /tmp/markata-public-install.sh
          head -n 1 /tmp/markata-public-install.sh | grep -Fx '#!/bin/bash'
          bash -n /tmp/markata-public-install.sh
          cmp /tmp/markata-reviewed-install.sh /tmp/markata-public-install.sh
          grep -Fq 'verify_archive' /tmp/markata-public-install.sh
          {
            echo '## Production installer verification'
            echo ''
            echo 'Verified: public markata.dev/install.sh equals current reviewed Markata main.'
            echo 'Validated shell syntax without executing the downloaded installer.'
            echo ''
            echo 'Public SHA-256:'
            sha256sum /tmp/markata-public-install.sh
          } >> "$GITHUB_STEP_SUMMARY"
