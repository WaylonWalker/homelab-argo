apiVersion: v1
kind: ServiceAccount
metadata:
  name: frigate-monitor
  namespace: frigate
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: frigate-monitor-logs
  namespace: frigate
rules:
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: frigate-monitor-logs
  namespace: frigate
subjects:
  - kind: ServiceAccount
    name: frigate-monitor
    namespace: frigate
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: frigate-monitor-logs
