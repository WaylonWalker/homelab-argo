apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: external-dns-canary
  namespace: whoami
  labels:
    external-dns-canary: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: external-dns-canary.wayl.one
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: whoami
                port:
                  number: 5678
