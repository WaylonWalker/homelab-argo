apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: wyattbubbylee-com-prod-tls
  namespace: wyattbubbylee-com-prod-notes
  labels:
    environment: production
    app.kubernetes.io/environment: production
spec:
  secretName: wyattbubbylee-com-prod-tls
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-dns
  dnsNames:
    - wyattbubbylee.com
    - www.wyattbubbylee.com
