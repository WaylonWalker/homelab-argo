apiVersion: v1
kind: Namespace
metadata:
  name: build
  namespace: build
---
apiVersion: v1
kind: Pod
metadata:
  name: kaniko-docker-build
  namespace: build
spec:
  containers:
    - name: kaniko
      image: gcr.io/kaniko-project/executor:latest
      args:
        - "--context=git://github.com/waylonwalker/htmx-patterns.git#main"
        - "--dockerfile=Dockerfile"
        - "--destination=registry.wayl.one/htmx-patterns"
        - "--verbosity=debug"
      env:
        - name: DOCKER_CONFIG
          value: "/kaniko/.docker"
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
  restartPolicy: Never
  volumes:
    - name: docker-config
      projected:
        sources:
          - secret:
              name: regcred
              items:
                - key: .dockerconfigjson
                  path: config.json
