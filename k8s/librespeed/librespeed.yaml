apiVersion: v1
kind: Namespace
metadata:
  name: librespeed
---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    service: librespeed
  name: librespeed
  namespace: librespeed
spec:
  ports:
    - name: "80"
      port: 80
      targetPort: 80
  selector:
    service: librespeed
status:
  loadBalancer: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  creationTimestamp: null
  labels:
    service: librespeed
  name: librespeed
  namespace: librespeed
spec:
  replicas: 1
  selector:
    matchLabels:
      service: librespeed
  strategy: {}
  template:
    metadata:
      creationTimestamp: null
      labels:
        service: librespeed
      annotations:
        diun.enable: "true"
    spec:
      automountServiceAccountToken: false
      containers:
        - env:
            - name: TZ
              value: UTC
          # LinuxServer v6.3.1-ls303; verified Nginx 1.30.7
          image: lscr.io/linuxserver/librespeed:v6.3.1-ls303@sha256:ad54c25a773cd7bfad5fd5dd82a4987a899edb0a9762e285c842eeb16bef4244
          imagePullPolicy: IfNotPresent
          name: librespeed
          ports:
            - containerPort: 80
              protocol: TCP
          resources: {}
      restartPolicy: Always
status: {}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  creationTimestamp: null
  labels:
    service: librespeed
  name: librespeed
  namespace: librespeed
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  rules:
    - host: librespeed.wayl.one
      http:
        paths:
          - backend:
              service:
                name: librespeed
                port:
                  number: 80
            path: /
            pathType: Prefix
    - host: speed.wayl.one
      http:
        paths:
          - backend:
              service:
                name: librespeed
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - librespeed.wayl.one
        - speed.wayl.one
      secretName: librespeed-cert-tls
status:
  loadBalancer: {}
