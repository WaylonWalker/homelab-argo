{{- if .Values.ingress.auth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: article-listener-strip-hlab
spec:
  headers:
    customRequestHeaders:
      X-Hlab-User-Id: ""
      X-Hlab-Username: ""
      X-Hlab-Display-Name: ""
      X-Hlab-Email: ""
      X-Hlab-Groups: ""
      X-Hlab-Roles: ""
      X-Hlab-Scopes: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: article-listener-forward-auth
spec:
  forwardAuth:
    address: {{ .Values.ingress.auth.address | quote }}
    trustForwardHeader: false
    addAuthCookiesToResponse:
      - __Host-hlab-app-session
    authResponseHeaders:
      - X-Hlab-User-Id
      - X-Hlab-Username
      - X-Hlab-Display-Name
      - X-Hlab-Email
      - X-Hlab-Groups
      - X-Hlab-Roles
      - X-Hlab-Scopes
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: article-listener-auth
spec:
  chain:
    middlewares:
      - name: article-listener-strip-hlab
      - name: article-listener-forward-auth
{{- end }}
