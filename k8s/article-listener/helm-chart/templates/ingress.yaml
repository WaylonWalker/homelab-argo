apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: article-listener
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/hostname: {{ join "," .Values.ingress.hosts | quote }}
    {{- if .Values.ingress.auth.enabled }}
    traefik.ingress.kubernetes.io/router.middlewares: article-listener-article-listener-strip-hlab@kubernetescrd
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  tls:
    - hosts:
        {{- range .Values.ingress.hosts }}
        - {{ . | quote }}
        {{- end }}
      secretName: article-listener-cert-tls
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: article-listener
                port: {name: http}
    {{- end }}
