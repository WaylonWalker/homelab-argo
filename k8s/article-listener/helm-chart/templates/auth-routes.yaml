{{- if .Values.ingress.auth.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: article-listener-auth-routes
spec:
  entryPoints:
    - web
  routes:
    {{- range .Values.ingress.hosts }}
    - kind: Rule
      match: >-
        Host(`{{ . }}`) &&
        (
          Path(`/login`) ||
          Path(`/logout`) ||
          Path(`/api/session`) ||
          PathPrefix(`/api/session/articles/`) ||
          (
            PathPrefix(`/api/articles`) &&
            (Method(`POST`) || Method(`PUT`) || Method(`PATCH`) || Method(`DELETE`))
          )
        )
      priority: 1000
      middlewares:
        - name: article-listener-auth
      services:
        - name: article-listener
          port: http
    {{- end }}
{{- end }}
