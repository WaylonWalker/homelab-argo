image:
  repository: registry.wayl.one/article-listener
  tag: "9fc64ea-20261016141323"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: regcred
ingress:
  hosts:
    - listen.waylonwalker.com
    - listen.wayl.one
  className: traefik
  auth:
    enabled: true
    address: http://hlab-auth.hlab-auth.svc.cluster.local:8000/api/v1/forward-auth
    publicOrigin: https://auth.waylonwalker.com
    requiredScope: article-listener:access
persistence:
  storageClass: longhorn
  size: 12Gi
nodeName: ""
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi
ttsService:
  url: http://kokoro.kokoro.svc.cluster.local
  secretName: article-listener-kokoro-auth
  secretKey: KOKORO_API_TOKEN
