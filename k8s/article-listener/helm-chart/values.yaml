image:
  repository: registry.wayl.one/article-listener
  tag: "9de528c-hlabauth-public-20261010"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: regcred
ingress:
  hosts:
    - listen.waylonwalker.com
    - listen.wayl.one
  className: traefik
  auth:
    enabled: true
    address: http://hlab-auth.hlab-auth.svc.cluster.local:8000/api/v1/forward-auth
    publicOrigin: https://auth.waylonwalker.com
    requiredScope: article-listener:access
persistence:
  storageClass: longhorn
  size: 12Gi
nodeName: ""
resources:
  requests:
    cpu: 500m
    memory: 2Gi
  limits:
    cpu: "4"
    memory: 8Gi
