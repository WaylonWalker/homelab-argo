{{- if .Values.privateRegistry.enabled }}
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: registry-pull
  namespace: {{ .Release.Namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  encryptedData:
    .dockerconfigjson: {{ required "privateRegistry.encryptedDockerConfig is required when privateRegistry.enabled is true" .Values.privateRegistry.encryptedDockerConfig | quote }}
  template:
    metadata:
      name: registry-pull
      namespace: {{ .Release.Namespace }}
      annotations:
        sealedsecrets.bitnami.com/managed: "true"
    type: kubernetes.io/dockerconfigjson
{{- end }}
