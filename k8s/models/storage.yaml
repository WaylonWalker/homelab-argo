apiVersion: v1
kind: PersistentVolume
metadata:
  name: models-library
  labels:
    app.kubernetes.io/name: models
spec:
  capacity:
    storage: 2Ti
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  local:
    path: /mnt/main/walkershare/waylon/3d
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [falcon3]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: models-library
  namespace: models
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: ""
  volumeName: models-library
  resources:
    requests:
      storage: 2Ti
