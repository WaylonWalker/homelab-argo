apiVersion: apps/v1
kind: Deployment
metadata:
  name: brainrot
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: brainrot}
  template:
    metadata:
      labels: {app: brainrot}
      annotations:
        kokoro.wayl.one/token-revision: {{ .Values.ttsService.tokenRevision | quote }}
    spec:
      {{- if .Values.privateRegistry.enabled }}
      imagePullSecrets:
        - name: registry-pull
      {{- else }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: web
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- if .Values.ingress.auth.enabled }}
            - name: HLAB_AUTH_REQUIRED
              value: "1"
            - name: HLAB_AUTH_ORIGIN
              value: {{ .Values.ingress.auth.publicOrigin | quote }}
            - name: HLAB_REQUIRED_SCOPE
              value: {{ .Values.ingress.auth.requiredScope | quote }}
            {{- else }}
            - name: APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: brainrot-auth
                  key: APP_PASSWORD
            {{- end }}
            - name: DATA_DIR
              value: /data
            - name: BRAINROT_PUBLIC_ORIGIN
              value: {{ printf "https://%s" .Values.ingress.host | quote }}
            - name: RSS_FEEDS
              value: {{ join "," .Values.rss.feeds | quote }}
            - name: RSS_POLL_INTERVAL_SECONDS
              value: {{ .Values.rss.pollIntervalSeconds | quote }}
            - name: COOKIE_SECURE
              value: "1"
            - name: DROPPER_PAT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.dropper.existingSecret | quote }}
                  key: {{ .Values.dropper.secretKey | quote }}
                  optional: true
            - name: OMP_NUM_THREADS
              value: "4"
            - name: TTS_SERVICE_URL
              value: {{ .Values.ttsService.url | quote }}
            - name: TTS_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.ttsService.secretName | quote }}
                  key: {{ .Values.ttsService.secretKey | quote }}
            - name: HF_HOME
              value: /data/models
            - name: XDG_CACHE_HOME
              value: /data/models
            - name: OTEL_SERVICE_NAME
              value: brainrot
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.telemetry.endpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.telemetry.sampleRatio | quote }}
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.claimName | default "brainrot-data" }}
