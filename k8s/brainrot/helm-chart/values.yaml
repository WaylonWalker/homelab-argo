image:
  repository: registry.wayl.one/brainrot
  tag: "0d9fbf1-20261016165828"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: cluster-regcred
telemetry:
  endpoint: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317
  sampleRatio: "1.0"
ingress:
  host: brainrot.waylonwalker.com
  className: traefik
  auth:
    enabled: true
    address: http://hlab-auth.hlab-auth.svc.cluster.local:8000/api/v1/forward-auth
    publicOrigin: https://auth.waylonwalker.com
    requiredScope: brainrot:create
persistence:
  storageClass: longhorn-backup
  size: 100Gi
  claimName: brainrot-data-local
  local:
    enabled: true
    path: /mnt/main/brainrot/data
    nodeName: falcon3
  preserveLegacyClaim: true
  legacyStorageClass: longhorn-backup
  legacySize: 100Gi
dropper:
  existingSecret: brainrot-dropper
  secretKey: DROPPER_PAT
rss:
  feeds:
    - https://waylonwalker.com/ping/rss.xml
    - https://justin.searls.co/shorter-form.xml
    - https://simonwillison.net/atom/notes/
  pollIntervalSeconds: 300
ttsService:
  url: http://kokoro.kokoro.svc.cluster.local
  secretName: brainrot-kokoro-auth
  secretKey: KOKORO_API_TOKEN
  tokenRevision: "20261011-2"
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: "4"
    memory: 2Gi
