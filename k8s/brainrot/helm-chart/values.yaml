image:
  repository: registry.wayl.one/brainrot
  tag: "501cb74-20261010202936"
  pullPolicy: IfNotPresent
imagePullSecrets:
  - name: cluster-regcred
ingress:
  host: brainrot.waylonwalker.com
  className: traefik
  auth:
    enabled: true
    address: http://hlab-auth.hlab-auth.svc.cluster.local:8000/api/v1/forward-auth
    publicOrigin: https://auth.waylonwalker.com
    requiredScope: brainrot:create
persistence:
  storageClass: longhorn-backup
  size: 100Gi
  claimName: brainrot-data-local
  local:
    enabled: true
    path: /mnt/main/brainrot/data
    nodeName: falcon3
  preserveLegacyClaim: true
  legacyStorageClass: longhorn-backup
  legacySize: 100Gi
dropper:
  existingSecret: brainrot-dropper
  secretKey: DROPPER_PAT
resources:
  requests:
    cpu: 500m
    memory: 3Gi
  limits:
    cpu: "4"
    memory: 8Gi
