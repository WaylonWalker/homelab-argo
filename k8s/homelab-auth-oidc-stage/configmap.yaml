apiVersion: v1
kind: ConfigMap
metadata:
  name: hlab-auth-stage-config
  namespace: hlab-auth-oidc-stage
data:
  HLAB_AUTH_ENVIRONMENT: production
  HLAB_AUTH_LOG_LEVEL: INFO
  HLAB_AUTH_API_PREFIX: /api/v1
  HLAB_AUTH_REQUEST_ID_HEADER: X-Request-ID
  HLAB_AUTH_HEALTH_CHECK_TIMEOUT_SECONDS: "2.0"
  HLAB_AUTH_RATE_LIMIT_DEFAULT_LIMIT: "60"
  HLAB_AUTH_RATE_LIMIT_WINDOW_SECONDS: "60"
  HLAB_AUTH_RATE_LIMIT_SENSITIVE_LIMIT: "5"
  HLAB_AUTH_RATE_LIMIT_SENSITIVE_WINDOW_SECONDS: "60"
  HLAB_AUTH_WEBAUTHN_RP_ID: auth-oidc-stage.wayl.one
  HLAB_AUTH_WEBAUTHN_ALLOWED_ORIGINS: '["https://auth-oidc-stage.wayl.one"]'
  HLAB_AUTH_WEBAUTHN_CHALLENGE_TTL_SECONDS: "300"
  HLAB_AUTH_SESSION_COOKIE_NAME: hlab_session
  HLAB_AUTH_SESSION_IDLE_TIMEOUT_DAYS: "1"
  HLAB_AUTH_SESSION_ABSOLUTE_TIMEOUT_DAYS: "7"
  HLAB_AUTH_TRUSTED_PROXY_CIDRS: '["10.42.0.0/16"]'
  HLAB_AUTH_PUBLIC_AUTH_ORIGIN: https://auth-oidc-stage.wayl.one
  HLAB_AUTH_OIDC_ENABLED: "true"
  HLAB_AUTH_OIDC_SIGNING_PRIVATE_KEY_FILE: /run/secrets/oidc/oidc-signing.pem
  HLAB_AUTH_OIDC_SIGNING_KEY_ID: oidc-stage-f06d896
  HLAB_AUTH_OIDC_RESOURCE: https://mcp-oidc-stage.wayl.one/mcp
