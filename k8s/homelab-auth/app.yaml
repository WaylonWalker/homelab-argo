apiVersion: apps/v1
kind: Deployment
metadata:
  name: hlab-auth
  namespace: hlab-auth
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hlab-auth
  template:
    metadata:
      labels:
        app: hlab-auth
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: cluster-regcred
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          image: registry.wayl.one/hlab-auth:v0.14.0
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: hlab-auth-config
            - secretRef:
                name: hlab-auth-secrets
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            timeoutSeconds: 3
            httpGet:
              path: /health/ready
              port: http
          livenessProbe:
            timeoutSeconds: 3
            httpGet:
              path: /health/live
              port: http
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: oidc-signing
              mountPath: /run/secrets/oidc
              readOnly: true
      volumes:
        - name: tmp
          emptyDir: {}
        - name: oidc-signing
          secret:
            secretName: hlab-auth-oidc-signing
            defaultMode: 0444
            items:
              - key: private.pem
                path: private.pem
---
apiVersion: v1
kind: Service
metadata:
  name: hlab-auth
  namespace: hlab-auth
spec:
  selector:
    app: hlab-auth
  ports:
    - name: http
      port: 8000
      targetPort: http
