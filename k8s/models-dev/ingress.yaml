apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: models-dev
  namespace: models-dev
spec:
  entryPoints:
    - web
  routes:
    - kind: Rule
      match: Host(`models-dev.waylonwalker.com`)
      middlewares:
        - name: models-dev-strip-hlab
          namespace: models-dev
        - name: hlab-auth-forwardauth
          namespace: hlab-auth
      services:
        - name: models-dev
          port: 8080
