apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: models-dev
  namespace: models-dev
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: models
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: TCP, port: 8080}
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: models-dev-db
      ports:
        - {protocol: TCP, port: 5432}
