apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: webroot
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: webroot
    app.kubernetes.io/instance: site
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 1Gi
  # Static PV binding (no dynamic provisioner).
  storageClassName: ""
  selector:
    matchLabels:
      app.kubernetes.io/name: webroot
      app.kubernetes.io/instance: site
