apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/instance: site
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
        app.kubernetes.io/name: web
        app.kubernetes.io/instance: site
    spec:
      shareProcessNamespace: true
      nodeSelector:
        kubernetes.io/hostname: falcon3
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
              httpHeaders:
                - name: Accept
                  value: text/plain
            initialDelaySeconds: 2
            periodSeconds: 10
          volumeMounts:
            - name: webroot
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-generated
              mountPath: /etc/nginx/generated
      volumes:
        - name: webroot
          persistentVolumeClaim:
            claimName: webroot
        - name: nginx-conf
          configMap:
            name: nginx-conf
        - name: nginx-generated
          emptyDir: {}
