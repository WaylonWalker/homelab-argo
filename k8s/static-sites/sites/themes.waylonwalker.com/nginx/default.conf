# Normalize clean URLs and map Accept header to preferred suffix
map $uri $clean_uri {
    ~^(.+)/$ $1;
    default $uri;
}

map "$http_accept|$uri" $accept_preferred_suffix {
    ~*application/markdown .md;
    ~*text/markdown .md;
    ~*text/plain .txt;
    ~*application/atom\+xml /atom.xml;
    ~*application/rss\+xml /rss.xml;
    ~*application/json\|/archive/?$ /feed.json;
    ~*application/json .json;
    default "";
}

map $http_accept $accept_prefers_html {
    ~*(text/html|application/xhtml\+xml) 1;
    default 0;
}

map $http_user_agent $ua_default_suffix {
    ~*^curl/ .ansi;
    ~*^Wget/ .ansi;
    ~*^HTTPie/ .ansi;
    ~*^xh/ .ansi;
    ~*^aria2/ .ansi;
    ~*^python-requests/ .ansi;
    ~*^Python-urllib/ .ansi;
    default "";
}

map $accept_preferred_suffix $preferred_suffix {
    "" $ua_default_suffix;
    default $accept_preferred_suffix;
}

map "$accept_prefers_html:$preferred_suffix" $should_serve_html {
    ~^1: 1;
    ~^0:[^:]+$ 0;
    default 1;
}

map $http_x_forwarded_proto $origin_is_https {
    ~*^https(?:,|$) 1;
    default 0;
}

map $http_cf_visitor $cf_visitor_is_https {
    ~*"scheme":"https" 1;
    default 0;
}

# Keep the security policy scoped to sites that have been checked against the
# shared static-site template.  A blank value causes nginx to omit the header
# for the other sites while they migrate to the same policy.
map $host $site_content_security_policy {
    default "";
    themes.waylonwalker.com "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; form-action 'self'; script-src 'self' https://telemetry.wayl.one 'sha256-6IH5C6SG9sl8pMbqil5cy6ETtCrRtcC5QbDTfZaBRys=' 'sha256-FD6Zdrp1TgAeWmCGpelQZbf9DcIB7jYAJAkLpStRD5M=' 'sha256-GA/Ie3p2la+zAqw7jPuHbT7gSrfeZ2okm5Lbs+W7vt8=' 'sha256-IteMsHoaiJvES1sDRwEDdKwvEn0wEyayjUczg7OXCsw=' 'sha256-OHfnm0RoSxDmIETm56uoW0n8t4hB76q9HPwnC4KcQnE='; style-src 'self'; font-src 'self' data:; img-src 'self' data: blob: https:; connect-src 'self' https://telemetry.wayl.one; worker-src 'self' blob:; manifest-src 'self'";
}

map $host $site_strict_transport_security {
    default "";
    themes.waylonwalker.com "max-age=31536000";
}

# Each site supplies these values through its site-config ConfigMap. The
# nginx image expands only the four TELEMETRY_* environment variables.
map ${TELEMETRY_ENABLED} $faro_bootstrap {
    default "";
    "enabled" '<script defer referrerpolicy="no-referrer" src="https://telemetry.wayl.one/assets/faro-bootstrap.0807bf7fa55c.js?v=0807bf7fa55c" integrity="sha384-iMIRUwlCb5KRB3hqbUxmlCtHcSyyiTBofcU2YpNAtbsKe699Ncdesw3p2eSbjCM4" crossorigin="anonymous" data-faro-app="${TELEMETRY_APP_NAME}" data-faro-environment="${TELEMETRY_ENVIRONMENT}" data-faro-version="${TELEMETRY_VERSION}"></script>';
}

map "$origin_is_https:$cf_visitor_is_https:${TELEMETRY_APP_NAME}:$host" $request_is_https {
    default 0;
    ~^1: 1;
    ~^0:1: 1;
    ~^0:0:3d-workshop:(localhost|127\.0\.0\.1)$ 1;
}

map "$should_serve_html:$request_is_https" $should_redirect_html_to_https {
    default 0;
    "1:0" 1;
}

map $clean_uri $representation_uri {
    / /index;
    default $clean_uri;
}

map $preferred_suffix $preferred_candidate {
    "" "/__nope__";
    default $representation_uri$preferred_suffix;
}

map $preferred_suffix $preferred_fallback_suffix {
    .ansi .txt;
    default "";
}

map $preferred_fallback_suffix $preferred_fallback_candidate {
    "" "/__nope__";
    default $representation_uri$preferred_fallback_suffix;
}

# Query param format overrides - for terminal/clients wanting non-html
map $arg_format $format_suffix {
    txt .txt;
    md .md;
    ansi .ansi;
    json .json;
    default "";
}

server {
    listen 80;
    # Ingress does the host routing; no need to hard-code domains here.
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Nginx sub_filter defaults to text/html, so assets and downloads stay unchanged.
    sub_filter_once on;
    sub_filter '</head>' '$faro_bootstrap</head>';
    # Preserve validators when the telemetry script changes the HTML body.
    sub_filter_last_modified on;
    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    # Write access logs to file for goaccess
    access_log /var/log/nginx/access.log combined;

    if ($should_redirect_html_to_https) {
        return 301 https://$host$request_uri;
    }

    # markata-go can generate a redirects.conf include from static/_redirects.
    # The builder sidecar syncs it into /etc/nginx/generated/ and reloads nginx.
    include /etc/nginx/generated/redirects*.conf;

    # Gzip compression - include markdown and text
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript text/markdown application/javascript application/xml application/json application/rss+xml application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy $site_content_security_policy always;
    add_header Strict-Transport-Security $site_strict_transport_security always;
    etag on;

    # Some themes/plugins emit relative asset URLs like `assets/markata/...`.
    # When requested from `/post-slug/`, browsers resolve it to
    # `/<post-slug>/assets/markata/...`. Rewrite to the canonical root path.
    #
    # This must appear before the generic `\.(css|js|...)$` regex location.
    location ~ ^/[^/]+/assets/markata/(.*)$ {
        rewrite ^/[^/]+/assets/markata/(.*)$ /assets/markata/$1 last;
    }

    # Cache static assets
    location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files /current$uri $uri =404;
    }

    # RSS/Atom/JSON feeds - shorter cache
    location ~* \.(xml|rss|atom|json)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=3600, stale-if-error=86400";
        try_files /current$uri $uri =404;
    }

    # Markdown and text files - no-store to prevent CF cache mixing
    location ~* \.md$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        default_type text/markdown;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header Vary Accept;
        try_files /current$uri $uri =404;
    }

    location ~* \.txt$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header Vary Accept;
        try_files /current$uri $uri =404;
    }

    location ~* \.ansi$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        default_type text/plain;
        charset utf-8;
        add_header Cache-Control "no-store";
        add_header Vary Accept;
        try_files /current$uri $uri =404;
    }

    location ~* \.json$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        default_type application/json;
        charset utf-8;
        add_header Cache-Control "public, max-age=0, s-maxage=3600, stale-while-revalidate=3600, stale-if-error=86400";
        add_header Vary Accept;
        try_files /current$uri $uri =404;
    }

    # Query param format (?format=txt|md|ansi|json) - no-store to prevent CF cache mixing
    location ~ \.(txt|md|ansi)$ {
        if ($arg_format) {
            add_header Cache-Control "no-store";
        }
        try_files /current$uri $uri =404;
    }

    # Explicit root negotiation avoids treating / as a directory candidate.
    location = / {
        if ($arg_format) {
            rewrite ^ /index$format_suffix? last;
        }
        if ($accept_preferred_suffix != "") {
            rewrite ^ /index$accept_preferred_suffix last;
        }
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400, stale-if-error=2592000";
        add_header Vary Accept;
        try_files /current/index.html /index.html =404;
    }

    # The content pages have real Markdown siblings and explicit cache policies.
    location ~ ^/(about|contact|privacy-policy)/$ {
        set $page_name $1;
        if ($arg_format) {
            rewrite ^ /$page_name$format_suffix? last;
        }
        if ($accept_preferred_suffix != "") {
            rewrite ^ /$page_name$accept_preferred_suffix last;
        }
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;
        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400, stale-if-error=2592000";
        add_header Vary Accept;
        try_files /current/$page_name/index.html /$page_name/index.html =404;
    }

    # Content negotiation for clean URLs (no extension)
    location ~ ^/[^.]*$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        # Rewrite query param format to suffix for content negotiation
        if ($arg_format) {
            rewrite ^ $representation_uri$format_suffix? last;
        }

        add_header Vary Accept;

        # Add no-store when format query param OR negotiated non-HTML format to prevent CF cache mixing
        set $cache_control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400, stale-if-error=2592000";
        if ($arg_format = "txt") {
            set $cache_control "no-store";
        }
        if ($arg_format = "md") {
            set $cache_control "no-store";
        }
        if ($arg_format = "ansi") {
            set $cache_control "no-store";
        }
        if ($arg_format = "json") {
            set $cache_control "no-store";
        }
        if ($preferred_suffix) {
            set $cache_control "no-store";
        }
        add_header Cache-Control $cache_control;

        # Try negotiated formats first, then fall back.
        try_files /current$preferred_candidate $preferred_candidate /current$preferred_fallback_candidate $preferred_fallback_candidate @clean_fallback;
    }

    location @clean_fallback {
        # Content negotiation attempted but format unavailable (RFC 7231)
        if ($preferred_suffix != "") {
            return 406;
        }
        # The named fallback is the final location for normal browser HTML
        # requests. Repeat the headers here because nginx does not inherit
        # add_header directives from the regex location after try_files.
        add_header Cache-Control $cache_control always;
        add_header Vary Accept always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;
        try_files /current$clean_uri/index.html /current$clean_uri $clean_uri/index.html $clean_uri $uri/index.html $uri =404;
    }

    # Default location
    location / {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy $site_content_security_policy always;
        add_header Strict-Transport-Security $site_strict_transport_security always;

        add_header Cache-Control "public, max-age=0, s-maxage=60, stale-while-revalidate=86400, stale-if-error=2592000";
        try_files /current$uri/index.html /current$uri $uri/index.html $uri =404;
    }

    # Pagefind search files
    location /_pagefind/ {
        try_files /current$uri $uri =404;
    }
    location /reader/ {
        try_files /current$uri $uri =404;
    }
    location /blogroll/ {
        try_files /current$uri $uri =404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 406 /406.html;
    error_page 500 502 503 504 /50x.html;
}
