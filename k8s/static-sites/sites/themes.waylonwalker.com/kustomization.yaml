apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

components:
  - ../../components/telemetry

resources:
  - ../../base
  - ../../components/hostpath-webroot
  - site-config.yaml

# This site uses the editor's remote motif image picker, so keep its checked
# security and validator policy local to this deployment.
generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: nginx-conf
    behavior: merge
    files:
      - default.conf.template=nginx/default.conf

replacements:
  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.namespace
    targets:
      - select:
          kind: Namespace
        fieldPaths:
          - metadata.name
      - select:
          kind: Deployment
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: Service
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: Ingress
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: PersistentVolumeClaim
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: ConfigMap
          name: nginx-conf
        fieldPaths:
          - metadata.namespace
        options:
          create: true
      - select:
          kind: ConfigMap
          name: site-config
        fieldPaths:
          - metadata.namespace
        options:
          create: true

  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.host
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host

  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.site
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - metadata.name
          - metadata.labels.[app.kubernetes.io/instance]
      - select:
          kind: PersistentVolumeClaim
        fieldPaths:
          - spec.selector.matchLabels.[app.kubernetes.io/instance]

  - source:
      kind: ConfigMap
      name: site-config
      fieldPath: data.webrootPath
    targets:
      - select:
          kind: PersistentVolume
        fieldPaths:
          - spec.hostPath.path

# ConfigMap names are stable, so pin a pod-template revision for this rollout.
patches:
  - target:
      kind: Deployment
      name: web
    patch: |-
      - op: add
        path: /spec/template/metadata/annotations/themes.waylonwalker.com~1headers-revision
        value: "2026-10-08-v3"
      - op: replace
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/0/value
        value: text/html
      - op: add
        path: /spec/template/spec/containers/0/readinessProbe/httpGet/httpHeaders/-
        value:
          name: X-Forwarded-Proto
          value: https
