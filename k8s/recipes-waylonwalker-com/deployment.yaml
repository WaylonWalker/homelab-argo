apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: recipes-waylonwalker-com
  annotations:
    argocd.argoproj.io/sync-options: Prune=confirm,Delete=confirm
  labels:
    app: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/restartedAt: "2026-02-16T08:08:15-06:00"
      labels:
        app: web
    spec:
      containers:
        - name: builder
          image: ghcr.io/waylonwalker/markata-go-builder:sha-46d6215
          imagePullPolicy: IfNotPresent
          command:
            - markata-go
            - builder-admin
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8080"
            - --source-dir
            - /data/source
            - --release-dir
            - /webroot
            - --work-dir
            - /work
            - --history-dir
            - /webroot/.builder-admin
            - --releases-keep
            - "5"
            - --watch=false
            - --webhook-enabled
            - --webhook-branch
            - main
          env:
            - name: MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: builder-webhook
                  key: MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /data/source
            - name: MARKATA_GO_URL
              value: https://recipes.waylonwalker.com
            - name: MARKATA_GO_CONCURRENCY
              value: "2"
            - name: MARKATA_GO_BUILDER_ADMIN_STARTUP_REBUILD
              value: "true"
          resources:
            requests:
              cpu: 25m
              memory: 512Mi
            limits:
              memory: 4Gi
          volumeMounts:
            - name: webroot
              mountPath: /webroot
            - name: work
              mountPath: /work
            - name: source
              mountPath: /data/source
              subPath: source
          ports:
            - name: builder-admin
              containerPort: 8080
              protocol: TCP
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /
              port: 80
              scheme: HTTP
            initialDelaySeconds: 2
            periodSeconds: 10
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 3
          volumeMounts:
            - name: webroot
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      nodeSelector:
        kubernetes.io/hostname: falcon3
      initContainers:
        - name: clone-source
          image: ghcr.io/waylonwalker/markata-go-builder:sha-46d6215
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ceu
          args:
            - |
              install -m 0700 -d /root/.ssh
              install -m 0600 /ssh/id_ed25519 /root/.ssh/id_ed25519
              ssh-keyscan -p 22 forgejo.forgejo.svc.cluster.local >> /root/.ssh/known_hosts
              git clone --branch main --single-branch \
                ssh://git@forgejo.forgejo.svc.cluster.local:22/waylon/recipes.waylonwalker.com \
                /data/source
              chown -R 65532:65532 /data/source
          securityContext:
            runAsUser: 0
          volumeMounts:
            - name: source
              mountPath: /data
            - name: source-ssh
              mountPath: /ssh
              readOnly: true
      volumes:
        - name: source
          emptyDir: {}
        - name: work
          emptyDir: {}
        - name: source-ssh
          secret:
            secretName: builder-source-ssh
            defaultMode: 0400
        - name: webroot
          persistentVolumeClaim:
            claimName: webroot
        - name: nginx-conf
          configMap:
            name: nginx-conf
