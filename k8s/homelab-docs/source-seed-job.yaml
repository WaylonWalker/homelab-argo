apiVersion: batch/v1
kind: Job
metadata:
  name: homelab-docs-source-seed
  labels:
    app.kubernetes.io/name: homelab-docs-source-seed
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homelab-docs-source-seed
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: falcon3
      restartPolicy: Never
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: alpine/git:2.47.2
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              if [ -f /data/source/.markata-notes-source-ready ]; then
                echo 'Source already seeded'
                exit 0
              fi
              git clone --depth 1 --branch main https://github.com/WaylonWalker/homelab-argo.git /tmp/source
              cp -a /tmp/source/. /data/source/
              touch /data/source/.markata-notes-source-ready
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: source
              mountPath: /data/source
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          persistentVolumeClaim:
            claimName: homelab-docs-notes-source-pvc
        - name: tmp
          emptyDir: {}
