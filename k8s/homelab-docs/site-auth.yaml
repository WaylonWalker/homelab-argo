apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homelab-docs-strip-hlab-identity
spec:
  headers:
    customRequestHeaders:
      X-Hlab-User-Id: ""
      X-Hlab-Username: ""
      X-Hlab-Display-Name: ""
      X-Hlab-Email: ""
      X-Hlab-Groups: ""
      X-Hlab-Roles: ""
      X-Hlab-Scopes: ""
      X-Hlab-Auth-Method: ""
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homelab-docs-forward-auth
spec:
  forwardAuth:
    address: http://hlab-auth.hlab-auth.svc.cluster.local:8000/api/v1/forward-auth
    trustForwardHeader: false
    addAuthCookiesToResponse:
      - __Host-hlab-app-session
    authResponseHeaders:
      - X-Hlab-User-Id
      - X-Hlab-Username
      - X-Hlab-Display-Name
      - X-Hlab-Email
      - X-Hlab-Groups
      - X-Hlab-Roles
      - X-Hlab-Scopes
      - X-Hlab-Auth-Method
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: homelab-docs-site-auth
spec:
  chain:
    middlewares:
      - name: homelab-docs-strip-hlab-identity
      - name: homelab-docs-forward-auth
