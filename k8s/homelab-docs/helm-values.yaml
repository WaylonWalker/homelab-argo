project_identifier: homelab-docs
project_name: homelab-docs
environment: prod

nodeSelector:
  kubernetes.io/hostname: falcon3

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

siteSecurityContext:
  allowPrivilegeEscalation: false
  runAsNonRoot: false
  runAsUser: 0

offline:
  enabled: true

ingress:
  enabled: false

markataEncryption:
  secretName: markata-go-encryption

storage:
  source:
    mode: pvc
    storageClassName: longhorn-site
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  site:
    mode: pvc
    storageClassName: longhorn-site
    size: 3Gi
    accessModes:
      - ReadWriteOnce
  cache:
    enabled: false
  search:
    size: 2Gi
    storageClassName: longhorn-site
    accessModes:
      - ReadWriteOnce

build:
  enabled: false
  fetchImage:
    tag: sha-4147602
  builderImage:
    tag: sha-4147602
  fast: false
  activeDeadlineSeconds: 1800
  releases:
    keep: 10
  extraEnv:
    - name: MARKATA_GO_URL
      value: https://homelab.waylonwalker.com

builderAdmin:
  enabled: true
  fast: false
  buildOnStartupRevisionChange: true
  auth:
    trustedProxyCIDRs:
      - 10.42.0.0/24
      - 10.42.2.0/24
  ingress:
    enabled: true
    host: build-homelab.waylonwalker.com
    ingressClassName: traefik
    annotations:
      external-dns.alpha.kubernetes.io/hostname: build-homelab.waylonwalker.com
    tls:
      enabled: true
      secretName: build-homelab-docs-tls
    auth:
      enabled: true
      internalUrl: http://hlab-auth.hlab-auth.svc.cluster.local:8000
      publicAuthOrigin: https://auth.waylonwalker.com
  networkPolicy:
    enabled: true
    traefikNamespace: kube-system
    traefikNamespaceSelector:
      kubernetes.io/metadata.name: kube-system
    traefikPodSelector:
      app.kubernetes.io/name: traefik
      app.kubernetes.io/instance: traefik-kube-system
  watch:
    enabled: false
    debounce: 2s
  releases:
    keep: 10
  history:
    successfulBuilds: 30
    failedBuilds: 30
    refreshRuns: 30
  buildTimeoutSeconds: 1800
  historyDir: /data/site/.builder-admin
  webhook:
    enabled: true
    branch: main
    existingSecretName: builder-webhook
    existingSecretKey: MARKATA_GO_BUILDER_ADMIN_WEBHOOK_SECRET

search:
  enabled: false

site:
  healthPath: /
  use404Page: true

sourceArchive:
  bucket: unused-in-hostpath-mode
  location: /unused-in-hostpath-mode
