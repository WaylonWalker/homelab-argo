apiVersion: apps/v1
kind: Deployment
metadata:
  name: stillframe
  labels:
    app.kubernetes.io/name: stillframe
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: stillframe
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stillframe
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: cluster-regcred
      initContainers:
        - name: migrate-data-to-walkershare
          image: registry.wayl.one/stillframe@sha256:60118aaa046c1e36bf789948d4cc037fd8d22e5283449acae186f19a5285a73d
          imagePullPolicy: IfNotPresent
          command:
            - /app/.venv/bin/python
            - -c
            - |
              import shutil
              from pathlib import Path

              source = Path("/legacy")
              target = Path("/target")
              progress = target / ".legacy-data-migration-in-progress"
              complete = target / ".legacy-data-migration-complete"

              if complete.exists():
                  progress.unlink(missing_ok=True)
                  print("Legacy data migration already complete")
              else:
                  if progress.exists():
                      for item in target.iterdir():
                          if item != progress:
                              shutil.rmtree(item) if item.is_dir() and not item.is_symlink() else item.unlink()
                  elif any(target.iterdir()):
                      raise SystemExit("Walkershare target is nonempty; refusing to overwrite it")

                  progress.touch(exist_ok=True)
                  for item in source.iterdir():
                      if item.name in {"lost+found", "library.sqlite3-shm"}:
                          continue
                      destination = target / item.name
                      if item.is_symlink():
                          destination.symlink_to(item.readlink())
                      elif item.is_dir():
                          shutil.copytree(item, destination, copy_function=shutil.copy2, symlinks=True)
                      else:
                          shutil.copy2(item, destination)
                  complete.write_text("Copied from stillframe-data Longhorn PVC\n")
                  progress.unlink()
                  print("Legacy Stillframe data copied to Walkershare")
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /target
            - name: legacy-data
              mountPath: /legacy
              readOnly: true
        - name: cache-search-models
          image: registry.wayl.one/stillframe@sha256:60118aaa046c1e36bf789948d4cc037fd8d22e5283449acae186f19a5285a73d
          imagePullPolicy: IfNotPresent
          command:
            - /app/.venv/bin/python
            - /app/scripts/install_models.py
          env:
            - name: STILLFRAME_DATA
              value: /data
            - name: HF_HOME
              value: /data/models/huggingface
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      nodeSelector:
        kubernetes.io/hostname: falcon3
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        # The Walkershare SMB mount is uid/gid 1000 and mode 0775.
        # Keep the app unprivileged while granting read access through this group.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: stillframe
          image: registry.wayl.one/stillframe@sha256:60118aaa046c1e36bf789948d4cc037fd8d22e5283449acae186f19a5285a73d
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: STILLFRAME_MODE
              value: hosted
            - name: STILLFRAME_DATA
              value: /data
            - name: STILLFRAME_FOLDER
              value: /photos
            - name: STILLFRAME_MAP_STYLE_URL
              value: https://tiles.openfreemap.org/styles/dark
            - name: STILLFRAME_MAP_CONNECT_ORIGINS
              value: https://tiles.openfreemap.org
            - name: STILLFRAME_PUBLIC_URL
              value: https://stillframe.waylonwalker.com
            - name: STILLFRAME_TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/24
            - name: STILLFRAME_OTEL_ENABLED
              value: "true"
            - name: STILLFRAME_ENVIRONMENT
              value: production
            - name: HF_HOME
              value: /data/models/huggingface
            - name: HF_HUB_DISABLE_TELEMETRY
              value: "1"
            - name: OTEL_SERVICE_NAME
              value: stillframe
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: grpc
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector-opentelemetry-collector.observability.svc.cluster.local:4317
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: "true"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
            - name: photos
              mountPath: /photos
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          hostPath:
            path: /mnt/main/walkershare/stillframe
            type: Directory
        - name: legacy-data
          persistentVolumeClaim:
            claimName: stillframe-data
        - name: photos
          hostPath:
            path: /mnt/main/walkershare/waylon/photos
            type: Directory
        - name: tmp
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: stillframe
spec:
  selector:
    app.kubernetes.io/name: stillframe
  ports:
    - name: http
      port: 8787
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: stillframe-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
  storageClassName: longhorn
