# The namespace where all resources will be created.
namespace: k8s-pages
# Number of replicas for the deployment.
replicaCount: 1
# Keep the production image on the current digest while validating updates in dev.
image: nginx:1.30.7@sha256:af61f605a001c7794200cae30093d8ee0da5183318df15fdfff3597ef37a7486
# List of sites to configure.
bucket: "k8s-pages"
sites:
  - name: pages
    host: example.com
    # URL to which the proxy_pass should direct traffic. (Include protocol and path)
    minioURL: "minio.minio.svc.cluster.local:9000"
    # The host header to set when proxying.
    minioHost: "minio.example.com"
    # Error Page
    errorPage: "/404.html"
    maxAge: 31536000
    staleWhileRevalidate: 86400
