apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lantern-table-traefik-ingress
  namespace: lantern-table
spec:
  podSelector:
    matchLabels:
      app: lantern-table
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
      ports:
        - protocol: TCP
          port: 8765
