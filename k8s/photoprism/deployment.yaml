# Retained storage for the retired PhotoPrism app. Do not delete its bound volume.
apiVersion: v1
kind: Namespace
metadata:
  name: photoprism
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photoprism-storage
  namespace: photoprism
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: hostpath
  volumeName: pv-photoprism-storage
  resources:
    requests:
      storage: 500Gi
