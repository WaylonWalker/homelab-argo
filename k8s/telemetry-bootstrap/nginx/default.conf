server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/javascript text/javascript;

    location ~ ^/assets/faro-(bootstrap|client)\.js$ {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=300, s-maxage=3600" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Immutable releases for sites using Subresource Integrity.
    location ~ "^/assets/faro-bootstrap\.[a-f0-9]{12}\.js$" {
        default_type application/javascript;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
