apiVersion: apps/v1
kind: Deployment
metadata:
  name: telemetry-bootstrap
  labels:
    app.kubernetes.io/name: telemetry-bootstrap
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: telemetry-bootstrap
  template:
    metadata:
      labels:
        app.kubernetes.io/name: telemetry-bootstrap
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /assets/faro-bootstrap.js
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            runAsGroup: 101
          volumeMounts:
            - name: content
              mountPath: /usr/share/nginx/html/assets
              readOnly: true
            - name: content
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: content
          configMap:
            name: telemetry-bootstrap-assets
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
