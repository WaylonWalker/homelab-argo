apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary
  namespace: hlab-auth-oidc-stage
  labels:
    app.kubernetes.io/name: registry-pull-canary
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 900
  imagePullSecrets:
    - name: registry-pull
  containers:
    - name: pull-check
      image: registry.wayl.one/hlab-auth@sha256:db7e4d4ae4d565e98883b636c3f5a63fe3d3bf851ce1d19dc88bb78b4ff4b214
      imagePullPolicy: Always
      command: ["/bin/sh", "-c", "sleep 600"]
