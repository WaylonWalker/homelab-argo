apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary
  namespace: kokoro
spec:
  automountServiceAccountToken: false
  imagePullSecrets:
    - name: registry-pull
  restartPolicy: Never
  containers:
    - name: pull-check
      image: registry.wayl.one/notify-bridge/app:0.1.105
      imagePullPolicy: Always
      command: ["sh", "-lc", "sleep 600"]
