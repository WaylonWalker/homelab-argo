apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary
  namespace: www-fokais
  labels:
    app.kubernetes.io/name: registry-pull-canary
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 900
  imagePullSecrets:
    - name: registry-pull
  containers:
    - name: site-check
      image: registry.wayl.one/www-fokais:0.1.0
      imagePullPolicy: Always
      ports:
        - name: http
          containerPort: 80
