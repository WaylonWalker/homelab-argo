apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary-linker
  namespace: linker
  labels:
    app: registry-pull-canary
    registry-pull-canary: 'true'
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 900
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  imagePullSecrets:
  - name: registry-pull
  containers:
  - name: pull-check
    image: registry.wayl.one/linker:0.0.4
    imagePullPolicy: Always
    command:
    - /bin/sh
    - -c
    args:
    - sleep 600
    resources:
      requests:
        cpu: 1m
        memory: 8Mi
