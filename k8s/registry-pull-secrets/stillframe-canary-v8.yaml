apiVersion: batch/v1
kind: Job
metadata:
  name: registry-pull-canary-v8
  namespace: stillframe
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-pull-canary
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-pull
      restartPolicy: Never
      containers:
        - name: pull-check
          image: registry.wayl.one/notify-bridge/app:0.1.105
          imagePullPolicy: Always
          command: ["sh", "-lc", "sleep 12"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
