apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary
  namespace: reader
  labels:
    app.kubernetes.io/name: registry-pull-canary
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  activeDeadlineSeconds: 900
  imagePullSecrets:
    - name: registry-pull
  containers:
    - name: pull-check
      image: registry.wayl.one/reader-waylonwalker-com:0.6.29
      imagePullPolicy: Always
      command: ["/bin/sh", "-c", "sleep 600"]
