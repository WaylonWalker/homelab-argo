apiVersion: batch/v1
kind: Job
metadata:
  name: registry-pull-dropper-canary
  namespace: dropper
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 180
  ttlSecondsAfterFinished: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-pull-canary
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-pull
      restartPolicy: Never
      containers:
        - name: pull-check
          image: registry.wayl.one/dropper:0.0.96
          imagePullPolicy: Always
          command: ["python", "-c", "import time; time.sleep(12)"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
