apiVersion: v1
kind: Pod
metadata:
  name: registry-pull-canary-shot-worker
  namespace: shot
  labels:
    app: registry-pull-canary
spec:
  automountServiceAccountToken: false
  activeDeadlineSeconds: 300
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  imagePullSecrets:
    - name: registry-pull
  containers:
    - name: pull-check
      image: registry.wayl.one/shot-scraper-api:0.0.51
      imagePullPolicy: Always
      command:
        - /bin/bash
        - -c
      args:
        - sleep 240
      resources:
        requests:
          cpu: 1m
          memory: 8Mi
