apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shot-api-ingress
  namespace: shot
spec:
  podSelector:
    matchLabels:
      app: shot-wayl-one
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
              app.kubernetes.io/instance: traefik-kube-system
        - podSelector:
            matchLabels:
              app: shot-wayl-one-cleanup
      ports:
        - protocol: TCP
          port: 5000
