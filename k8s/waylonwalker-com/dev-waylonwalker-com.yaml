# Dev site workload and ingress are retired; retain its storage resources.
apiVersion: v1
kind: Namespace
metadata:
  name: dev-waylonwalker-com
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-waylonwalker-com-build-hostpath2
  namespace: dev-waylonwalker-com
spec:
  storageClassName: hostpath
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  volumeName: dev-waylonwalker-com-build-hostpath2
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: dev-waylonwalker-com-build-hostpath2
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: hostpath
  hostPath:
    path: /mnt/vault/nfs/general/pv/dev-waylonwalker-com
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-waylonwalker-com-site
  namespace: dev-waylonwalker-com
spec:
  storageClassName: longhorn-backup
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dev-waylonwalker-com-site-replicated
  namespace: dev-waylonwalker-com
spec:
  storageClassName: longhorn-fast-replicated
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
