apiVersion: v1
kind: ConfigMap
metadata:
  name: markata-docs-nginx
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      server_tokens off;
      root /usr/share/nginx/html/current;
      index index.html;

      gzip on;
      gzip_min_length 512;
      gzip_types text/css application/javascript application/json image/svg+xml text/xml;

      location = /healthz {
        access_log off;
        return 200 "ok\n";
      }

      # Docs are real pages, not a single-page application.
      location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
      }

      # Static filenames are not content hashed.
      location ~* \.(?:css|js|png|jpe?g|svg|gif|webp|woff2?|ico)$ {
        add_header Cache-Control "public, max-age=300";
        try_files $uri =404;
      }

      location ~ /\. {
        deny all;
      }
    }
