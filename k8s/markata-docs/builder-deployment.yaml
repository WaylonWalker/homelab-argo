apiVersion: apps/v1
kind: Deployment
metadata:
  name: markata-docs-builder
  labels:
    app.kubernetes.io/name: markata-docs-builder
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: markata-docs-builder
  template:
    metadata:
      labels:
        app.kubernetes.io/name: markata-docs-builder
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/hostname: falcon3
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: seed-first-release
          # Preserve the last verified GitHub-produced pages until first local build.
          image: ghcr.io/waylonwalker/markata-docs:0.0.31
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              if [ ! -e /data/site/current ]; then
                mkdir -p /data/site/releases/seed
                cp -R /usr/share/nginx/html/. /data/site/releases/seed/
                ln -s releases/seed /data/site/current
              fi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: site
              mountPath: /data/site
      containers:
        - name: builder
          # Pinned to the verified successful upstream main docs workflow run 24.
          image: ghcr.io/waylonwalker/markata-docs-builder:0.0.148
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCS_REPOSITORY
              value: https://github.com/WaylonWalker/markata.git
            - name: DOCS_BRANCH
              value: main
            - name: DOCS_SOURCE_DIR
              value: /data/source/repo
            - name: DOCS_SITE_DIR
              value: /data/site
            - name: DOCS_POLL_SECONDS
              value: "45"
            - name: DOCS_KEEP_RELEASES
              value: "7"
            - name: DOCS_BUILD_TIMEOUT_SECONDS
              value: "900"
            - name: DOCS_BUILDER_ORIGIN
              value: https://build.markata.waylonwalker.com
            - name: DOCS_TRUSTED_PROXY_CIDRS
              value: 10.42.0.0/24,10.42.2.0/24
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 30
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: "2"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: source
              mountPath: /data/source
            - name: site
              mountPath: /data/site
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: source
          emptyDir:
            sizeLimit: 2Gi
        - name: site
          persistentVolumeClaim:
            claimName: markata-docs-site
        - name: tmp
          emptyDir: {}
