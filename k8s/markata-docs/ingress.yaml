apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: markata-docs
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-dns
    external-dns.alpha.kubernetes.io/hostname: markata.waylonwalker.com
spec:
  ingressClassName: traefik
  rules:
    - host: markata.waylonwalker.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: markata-docs
                port:
                  name: http
  tls:
    - hosts:
        - markata.waylonwalker.com
      secretName: markata-docs-tls
