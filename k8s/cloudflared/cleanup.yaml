apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared-pod-cleanup
  namespace: cloudflared
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: cloudflared-pod-cleanup
  namespace: cloudflared
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: cloudflared-pod-cleanup
  namespace: cloudflared
subjects:
  - kind: ServiceAccount
    name: cloudflared-pod-cleanup
    namespace: cloudflared
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: cloudflared-pod-cleanup
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: cloudflared-pod-cleanup
  namespace: cloudflared
spec:
  schedule: "*/30 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      activeDeadlineSeconds: 600
      ttlSecondsAfterFinished: 86400
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: cloudflared-pod-cleanup
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: cleanup
              image: docker.io/library/python:3.13-alpine@sha256:2dd78ad5cf13a0b68f5134dc49aa9950203a8cf4b7463431b9f3b398287c5059
              command: [python, /scripts/pod_cleanup.py, --keep, "20"]
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: cloudflared-pod-cleanup
