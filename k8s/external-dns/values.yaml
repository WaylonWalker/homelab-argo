replicaCount: 1

sources:
  - ingress
provider:
  name: cloudflare
# create-only is additive-only: create missing records, never update or delete
# existing ones. Existing working DNS is left untouched.
policy: create-only
registry: txt
txtOwnerId: falcon-homelab-external-dns
txtPrefix: external-dns-%{record_type}.
# The generated zone-ids.yaml overlay replaces this bootstrap list with every
# Cloudflare zone that the token can see.
domainFilters:
  - waylonwalker.com
  - rhiannonwalker.com
  - wyattbubbylee.com
  - wayl.one
# The canary label filter was removed: every Traefik Ingress is now in scope.
# `dry-run` is off, so missing records are created for real. `create-only`
# keeps this additive-only: existing records are never updated or deleted.
# New hosts still need a verified falcon tunnel route to actually serve
# traffic, including hosts in zones that use another tunnel today.
managedRecordTypes:
  - CNAME

extraArgs:
  cloudflare-dns-records-per-page: '5000'
  cloudflare-proxied: true
  cloudflare-record-comment: Managed by ExternalDNS (falcon homelab)
  ingress-class: traefik

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: external-dns-cloudflare
        key: api-token

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 128Mi
