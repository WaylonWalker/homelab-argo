apiVersion: batch/v1
kind: Job
metadata:
  name: registry-pull-canary
  namespace: thoughts
  labels:
    app.kubernetes.io/name: registry-pull-canary
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  template:
    metadata:
      labels:
        app.kubernetes.io/name: registry-pull-canary
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: registry-pull
      containers:
        - name: pull-check
          image: registry.wayl.one/thoughts:0.0.36
          imagePullPolicy: Always
          command: ["python", "-c", "print('registry pull canary passed')"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
