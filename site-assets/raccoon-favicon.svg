.raccoon-favicon .cheek-line{stroke:var(--raccoon-fur-white,#fff9f0);stroke-width:5;fill:none;stroke-linecap:round}
.raccoon-favicon .nose-shine{fill:var(--raccoon-accent,var(--color-accent,var(--accent,#f0b66b)))}
.raccoon-favicon .accent-fill{fill:var(--raccoon-accent,var(--color-accent,var(--accent,#f0b66b)))}
.raccoon-favicon .accent-stroke{stroke:var(--raccoon-accent,var(--color-accent,var(--accent,#f0b66b)));fill:none;stroke-linecap:round;stroke-linejoin:round}
.raccoon-favicon .k8s-wheel-use{fill:var(--raccoon-accent,var(--color-accent,var(--accent,#f0b66b)))}
